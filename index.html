<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maoré Quest — que faire à Mayotte</title>
<meta name="description" content="Tout ce qu'il y a à faire à Mayotte, et comment le réserver. Marées, saisons, conseils de terrain. Pour les visiteurs comme pour les Mahorais. Fonctionne hors connexion.">
<meta name="theme-color" content="#0a3a57" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08151a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maoré Quest">
<meta property="og:title" content="Maoré Quest — que faire à Mayotte">
<meta property="og:description" content="Le carnet de l'île : activités, marées, saisons, conseils de terrain, et le bon numéro à appeler.">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<!-- iOS ne sait pas lire un SVG en apple-touch-icon : sans ce PNG, il met une
     capture grise de la page sur l'écran d'accueil. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preload" href="assets/fonts/karibu-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/youngserif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="saut-contenu" href="#vue">Aller au contenu</a>

<header class="topbar" id="topbar">
  <button class="topbar__marque" id="marque" aria-label="Retour à l'accueil">
    <span id="logo-slot"></span><span>Maoré Quest</span>
  </button>
  <span class="topbar__titre" id="topbar-titre" aria-hidden="true"></span>
  <span class="topbar__espace"></span>
  <button class="icone-btn" id="btn-recherche" aria-expanded="false" aria-controls="recherche"
          aria-label="Rechercher"></button>
</header>

<div class="topbar__lecture" id="lecture" aria-hidden="true"><i></i></div>

<div class="recherche" id="recherche" hidden>
  <div class="recherche__champ">
    <span id="loupe-slot"></span>
    <input id="q" type="search" placeholder="Baleines, Choungui, mataba, sans voiture…"
           autocomplete="off" aria-label="Rechercher une activité, un lieu, une envie">
    <button class="icone-btn" id="btn-vider" aria-label="Effacer la recherche"
            style="width:1.9rem;height:1.9rem;box-shadow:none;border:0;background:none"></button>
  </div>
</div>

<!-- Définitions SVG partagées (trame claustra). Doivent être dans le document
     pour que les url(#km-claustra) des cartouches résolvent. -->
<div id="km-defs" aria-hidden="true"></div>

<main id="vue" tabindex="-1"></main>

<!-- Barre d'action de la fiche : hors de #vue pour ne pas être reconstruite,
     affichée par le CSS uniquement quand body[data-vue="lieu"] -->
<div class="barre-fiche" id="barre-fiche"></div>

<!-- Feuille qui monte du bas : remplace alert()/confirm(). Une boîte système
     s'annonce au nom du domaine — c'est le signal le plus net qu'on est sur
     une page web — elle tronque les longs textes et ne se sélectionne pas. -->
<dialog class="feuille" id="feuille" aria-labelledby="feuille-titre"></dialog>

<nav class="onglets" aria-label="Navigation principale">
  <a class="onglet" href="#/"            data-r="/"           ><span class="ico"></span>Aujourd'hui</a>
  <a class="onglet" href="#/explorer"    data-r="/explorer"   ><span class="ico"></span>Explorer</a>
  <a class="onglet" href="#/itineraires" data-r="/itineraires"><span class="ico"></span>Journées</a>
  <a class="onglet" href="#/carte"       data-r="/carte"      ><span class="ico"></span>Carte</a>
  <a class="onglet" href="#/carnet"      data-r="/carnet"     ><span class="ico"></span>Carnet</a>
</nav>

<div id="annonce" class="sr" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:2rem;text-align:center">
    Cette application a besoin de JavaScript pour fonctionner. Tout se passe sur votre téléphone :
    aucune donnée n'est envoyée à un serveur.
  </div>
</noscript>

<script src="data.js"></script>
<script src="data-resa.js"></script>
<script src="photos.js"></script>
<script src="marque.js"></script>
<script src="carte.js"></script>
<script src="carte-vue.js"></script>
<script src="postale.js"></script>
<script src="recherche.js"></script>
<script src="intentions.js"></script>
<script src="astro.js"></script>
<script src="hijri.js"></script>
<script src="marees.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
